<!DOCTYPE html>
<!-- Text content is the English reference wording (the default_locale). popup.js
     replaces every [data-i18n] element with the matching _locales message and
     rewrites lang= to the active UI locale. The inline text is a real fallback:
     if a message is missing, the English wording stays and the label keeps
     working. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title data-i18n="appName">LinkedIn Focus</title>
</head>
<body>
  <header>
    <h1 data-i18n="appName">LinkedIn Focus</h1>
    <p class="hint" data-i18n="popupHint">On = hidden (focus)</p>
  </header>

  <ul class="toggles">
    <li>
      <label for="hideFeed" data-i18n="toggleFeed">Feed / Timeline</label>
      <span class="switch">
        <input type="checkbox" id="hideFeed">
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
    <li>
      <label for="hideAds" data-i18n="toggleAds">Ads</label>
      <span class="switch">
        <input type="checkbox" id="hideAds">
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
    <li>
      <label for="hideNews" data-i18n="toggleNews">News &amp; Games</label>
      <span class="switch">
        <input type="checkbox" id="hideNews">
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
    <li>
      <label for="hideBadges" data-i18n="toggleBadges">Notification badges</label>
      <span class="switch">
        <input type="checkbox" id="hideBadges">
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
  </ul>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
