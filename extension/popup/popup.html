<!DOCTYPE html>
<!-- English is the only shipped language. popup.js reads the messages from
     the extension bundle. The inline text is a fallback:
     if a message is missing, the English wording stays and the label keeps
     working. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title data-i18n="appName">LinkedIn Focus</title>
</head>
<body>
  <header>
    <h1 data-i18n="appName">LinkedIn Focus</h1>
    <p class="hint" data-i18n="popupHint">On = hidden (focus)</p>
  </header>

  <ul class="toggles">
    <li>
      <label for="hideFeed" data-i18n="toggleFeed">Feed / Timeline</label>
      <span class="switch">
        <input type="checkbox" id="hideFeed" disabled>
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
    <li>
      <label for="hideAds" data-i18n="toggleAds">Ads</label>
      <span class="switch">
        <input type="checkbox" id="hideAds" disabled>
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
    <li>
      <label for="hideNews" data-i18n="toggleNews">News &amp; Games</label>
      <span class="switch">
        <input type="checkbox" id="hideNews" disabled>
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
    <li>
      <label for="hideBadges" data-i18n="toggleBadges">Notification badges</label>
      <span class="switch">
        <input type="checkbox" id="hideBadges" disabled>
        <span class="track"><span class="thumb"></span></span>
      </span>
    </li>
  </ul>

  <section class="accounts" aria-labelledby="allowedAccountsHeading">
    <h2 id="allowedAccountsHeading" data-i18n="allowedAccountsHeading">Allowed accounts</h2>
    <p class="hint" id="allowedAccountsHint" data-i18n="allowedAccountsHint">See posts from these accounts while the feed is hidden.</p>
    <form id="allowedAccountsForm">
      <fieldset id="allowedAccountsControls" disabled>
        <label for="accountUrl" data-i18n="accountUrl">LinkedIn profile or company URL</label>
        <div class="account-entry">
          <input type="text" id="accountUrl" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="allowedAccountsHint" required>
          <button type="submit" data-i18n="addAccount">Add</button>
        </div>
        <ul id="allowedAccountsList" class="account-list"></ul>
      </fieldset>
    </form>
    <p id="accountStatus" class="hint" role="status"></p>
  </section>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
